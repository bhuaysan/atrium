name: Atrium
options:
  bundleIdPrefix: io.github.bhuaysan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    WARNING_CFLAGS: ["-Wno-documentation", "-Wno-documentation-deprecated-sync"]
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Atrium:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Atrium.xcconfig
      Release: Config/Atrium.xcconfig
    sources:
      - path: Atrium
        excludes:
          - "**/.DS_Store"
          - Bridge/URPixelConversion.c
      - path: Atrium/Support/Secrets.generated.swift
        optional: true
      # Converts every frame of Vulkan cores: optimised in Debug builds too.
      - path: Atrium/Bridge/URPixelConversion.c
        compilerFlags: ["-O2"]
      # RetroAchievements runtime (MIT), see ThirdParty/rcheevos/README.md.
      - path: ThirdParty/rcheevos/src
        compilerFlags: ["-w"]
        excludes:
          - "**/*.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bhuaysan.Atrium
        PRODUCT_NAME: Atrium
        INFOPLIST_FILE: Atrium/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atrium/Atrium.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Atrium/Bridge/Atrium-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GL_SILENCE_DEPRECATION=1", "RC_DISABLE_LUA=1",
                                       "RC_CLIENT_SUPPORTS_HASH=1", "RC_HASH_NO_ENCRYPTED=1"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/ThirdParty/rcheevos/include", "$(SRCROOT)/ThirdParty/rcheevos/src",
                             "$(SRCROOT)/ThirdParty/librashader/include", "$(SRCROOT)/ThirdParty/moltenvk/include",
                             "$(SRCROOT)/Atrium/Bridge"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/ThirdParty/librashader/lib", "$(SRCROOT)/ThirdParty/moltenvk/lib"]
        OTHER_LDFLAGS: ["$(inherited)", "-lz", "-lcompression"]
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      # RetroArch slang shaders (MPL-2.0), fetched by Scripts/fetch-librashader.sh;
      # see ThirdParty/librashader/README.md.
      - framework: ThirdParty/librashader/lib/librashader.dylib
        embed: true
        codeSign: true
      # Vulkan for libretro cores (Apache-2.0), fetched by Scripts/fetch-moltenvk.sh;
      # see ThirdParty/moltenvk/README.md.
      - framework: ThirdParty/moltenvk/lib/libMoltenVK.dylib
        embed: true
        codeSign: true
      - sdk: OpenGL.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: IOKit.framework
      - sdk: IOUSBHost.framework
    preBuildScripts:
      - name: Generate ScreenScraper secrets
        script: |
          "${SRCROOT}/Scripts/generate-secrets.sh" "${SRCROOT}/.env" "${SRCROOT}/Atrium/Support/Secrets.generated.swift"
        inputFiles:
          - $(SRCROOT)/Scripts/generate-secrets.sh
        outputFiles:
          - $(SRCROOT)/Atrium/Support/Secrets.generated.swift
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Dolphin dlopens "libvulkan.1.dylib" at boot; dyld finds this link
      # through the app's rpath and hands it the MoltenVK that is already
      # loaded. See ThirdParty/moltenvk/README.md.
      - name: Link libvulkan to MoltenVK
        script: |
          ln -sf libMoltenVK.dylib "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/libvulkan.1.dylib"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libvulkan.1.dylib
        basedOnDependencyAnalysis: false

  AtriumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AtriumTests
    dependencies:
      - target: Atrium
      # Loaded with dlopen like a downloaded core, so copied, not linked.
      - target: atrium-test-core
        link: false
        embed: true
        copy:
          destination: resources
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Atrium.app/Contents/MacOS/Atrium
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bhuaysan.AtriumTests
        GENERATE_INFOPLIST_FILE: YES

  # A libretro core for the tests (AtriumTests/EmulationRunnerTests.swift).
  atrium-test-core:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Tools/atrium-test-core
    settings:
      base:
        PRODUCT_NAME: atrium-test-core
        EXECUTABLE_PREFIX: ""
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Atrium/Bridge", "$(SRCROOT)/ThirdParty/moltenvk/include"]
        SKIP_INSTALL: YES

  atrium-smoke:
    type: tool
    platform: macOS
    sources:
      - path: Tools/atrium-smoke
      - path: Atrium/Bridge/URLibretroCore.m
      - path: Atrium/Bridge/URGLContext.m
      - path: Atrium/Bridge/URVulkanContext.m
      - path: Atrium/Bridge/URPixelConversion.c
        compilerFlags: ["-O2"]
      - path: Atrium/Bridge/URAudioRing.c
      - path: Atrium/Bridge/URShaderChain.m
      - path: Atrium/Bridge/URShaderPreset.m
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Atrium/Bridge", "$(SRCROOT)/ThirdParty/librashader/include",
                             "$(SRCROOT)/ThirdParty/moltenvk/include"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/ThirdParty/librashader/lib", "$(SRCROOT)/ThirdParty/moltenvk/lib"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/ThirdParty/librashader/lib", "$(SRCROOT)/ThirdParty/moltenvk/lib"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GL_SILENCE_DEPRECATION=1"]
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - framework: ThirdParty/librashader/lib/librashader.dylib
        embed: false
      - framework: ThirdParty/moltenvk/lib/libMoltenVK.dylib
        embed: false
      - sdk: OpenGL.framework
      - sdk: ImageIO.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework

schemes:
  atrium-smoke:
    build:
      targets:
        atrium-smoke: all
  Atrium:
    build:
      targets:
        Atrium: all
        AtriumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtriumTests
    profile:
      config: Release
    archive:
      config: Release
